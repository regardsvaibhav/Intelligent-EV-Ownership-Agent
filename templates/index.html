<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#22262b">
<title>ई-रिक्शा सहायक</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  /* Asphalt, rickshaw yellow, and the green of an Indian EV number plate */
  :root{
    --road:#22262b; --road-2:#343a41; --signal:#f2c200; --plate:#1e7a4c; --plate-ink:#ffffff;
    --leaf-soft:#e3f1e9; --paper:#f3f4f1; --card:#ffffff; --ink:#16181b; --muted:#5d636b; --line:#d9dbd5;
    --warn:#b3261e; --warn-soft:#fbe9e7; --amber:#c77700; --amber-soft:#fff3d6;
    --focus:#f2c200; --dock:#ffffff;
  }
  /* Sun mode: black and yellow for direct sunlight */
  :root[data-theme="sun"]{
    --road:#000; --road-2:#1b1b1b; --signal:#ffe14d; --paper:#000; --card:#111; --ink:#fff; --muted:#e7e7e7;
    --line:#ffe14d; --leaf-soft:#0d2e1d; --warn-soft:#3a0f0c; --amber-soft:#3a2c00; --dock:#000; --focus:#fff;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--paper);color:var(--ink)}
  body{font-family:"Baloo 2","Noto Sans Devanagari",system-ui,sans-serif;font-size:18px;line-height:1.45;
       min-height:100dvh;display:flex;justify-content:center;-webkit-tap-highlight-color:transparent}
  .app{width:100%;max-width:480px;min-height:100dvh;display:flex;flex-direction:column;position:relative}
  button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
  button:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid var(--focus);outline-offset:3px}
  .ic{display:inline-flex;flex:none;width:24px;height:24px}.ic svg{width:100%;height:100%}

  /* App bar */
  .bar{background:var(--road);color:#fff;padding:14px 16px 12px;border-bottom:5px solid var(--signal);
       display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:5}
  .bar h1{margin:0;font-size:24px;font-weight:800;line-height:1.1;flex:1}
  .barbtn{height:44px;min-width:44px;padding:0 12px;border-radius:12px;background:var(--road-2);color:#fff;display:flex;
          align-items:center;gap:6px;font-size:15px;font-weight:600}
  :root[data-theme="sun"] .barbtn[aria-pressed="true"]{background:var(--signal);color:#000}

  /* Memory, drawn as green EV number plates */
  .plates{display:flex;gap:8px;padding:10px 16px;flex-wrap:wrap;background:var(--card);border-bottom:1.5px solid var(--line)}
  .plates[hidden]{display:none}
  .plate{display:inline-flex;align-items:center;gap:6px;background:var(--plate);color:var(--plate-ink);border-radius:7px;
         padding:3px 12px;font-weight:800;font-size:17px;letter-spacing:.02em;box-shadow:inset 0 0 0 2px rgba(255,255,255,.75),
         0 0 0 1.5px var(--plate)}
  .plate .ic{width:18px;height:18px}
  .plates .hint{font-size:13px;color:var(--muted);align-self:center}

  main{flex:1;padding:16px 16px 150px;display:flex;flex-direction:column;gap:14px}

  /* Answer card */
  .card{background:var(--card);border:1.5px solid var(--line);border-radius:22px;padding:18px}
  .card h2{margin:0 0 6px;font-size:21px;line-height:1.25}
  .muted{color:var(--muted);font-size:15px}
  .big{font-size:76px;font-weight:800;line-height:1}
  .row{display:flex;align-items:center;gap:10px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .action{min-height:64px;border-radius:18px;font-size:20px;font-weight:800;display:flex;align-items:center;justify-content:center;
          gap:8px;padding:8px 12px;text-align:center;line-height:1.2}
  .a-yes{background:var(--plate);color:#fff}
  .a-no{background:var(--card);color:var(--warn);border:3px solid var(--warn)}
  .a-main{background:var(--signal);color:#16181b}
  .a-dark{background:var(--road);color:#fff}
  :root[data-theme="sun"] .a-dark{background:#fff;color:#000}
  .a-soft{background:var(--paper);color:var(--ink);border:2px solid var(--line)}
  .choice{min-height:58px;border-radius:14px;background:var(--paper);border:2px solid var(--line);font-size:19px;font-weight:800}

  /* Gauge */
  .battery{position:relative;height:84px;border:6px solid var(--ink);border-radius:18px;padding:6px;margin:6px 22px 6px 0}
  .battery::after{content:"";position:absolute;right:-18px;top:22px;width:10px;height:28px;background:var(--ink);border-radius:0 6px 6px 0}
  .battery .fill{height:100%;border-radius:9px;background:var(--plate);transition:width .6s ease}
  .battery .fill.low{background:var(--warn)}.battery .fill.mid{background:var(--amber)}
  .battery span{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:28px;font-weight:800;color:#fff;
                background:rgba(22,24,27,.72);border-radius:12px;padding:0 12px;line-height:1.35}
  .km{display:flex;align-items:baseline;gap:8px;margin-top:6px}
  .km .unit{font-size:28px;font-weight:800}
  .facts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;border-top:1.5px solid var(--line);margin-top:12px;padding-top:12px}
  .facts b{display:block;font-size:19px;line-height:1.2}.facts small{font-size:13px;color:var(--muted)}

  /* Trip */
  .route{display:flex;align-items:center;gap:10px;font-size:20px;font-weight:800}
  .route i{flex:1;border-top:3px dashed var(--muted)}
  .lights{display:flex;gap:12px;background:#22262b;border-radius:40px;padding:9px 14px;width:max-content;margin:12px 0 6px}
  .lights b{width:40px;height:40px;border-radius:50%;opacity:.22}
  .lights .r{background:#ff4a3d}.lights .y{background:#ffc400}.lights .g{background:#2fd27a}
  .lights b.on{opacity:1;box-shadow:0 0 16px 3px currentColor}
  .lights .r.on{color:#ff4a3d}.lights .y.on{color:#ffc400}.lights .g.on{color:#2fd27a}
  .verdict{font-size:28px;font-weight:800;line-height:1.15}
  .v-yes{color:var(--plate)}.v-borderline{color:var(--amber)}.v-no{color:var(--warn)}
  :root[data-theme="sun"] .v-yes{color:#2fd27a}
  .meter{display:grid;gap:3px;margin-top:10px}
  .meter .track{height:14px;border-radius:7px;background:var(--paper);overflow:hidden;border:1px solid var(--line)}
  .meter .track i{display:block;height:100%;border-radius:7px}
  .todo{display:flex;gap:10px;align-items:flex-start;background:var(--paper);border-radius:14px;padding:10px 12px;margin-top:10px;font-size:16px}
  .todo .ic{color:var(--plate);margin-top:2px}

  /* Stations */
  .st{display:flex;gap:12px;align-items:center;border:1.5px solid var(--line);border-radius:16px;padding:12px;margin-top:10px}
  .st.best{border:3px solid var(--plate)}
  .st .name{font-size:19px;font-weight:800;line-height:1.2}
  .st .price{margin-left:auto;text-align:right}.st .price b{font-size:26px;line-height:1;display:block}
  .tag{display:inline-block;font-size:13px;font-weight:700;padding:1px 9px;border-radius:999px;margin:3px 4px 0 0}
  .t-best{background:var(--plate);color:#fff}.t-24{background:#22262b;color:#f2c200}
  .t-demo{background:var(--paper);color:var(--muted);border:1px dashed var(--muted)}

  /* Savings */
  .bars{display:grid;gap:8px;margin-top:10px}
  .bars .b{display:grid;grid-template-columns:110px 1fr 56px;gap:8px;align-items:center;font-size:15px}
  .bars .b b{text-align:right}
  .bars .track{height:16px;border-radius:8px;background:var(--paper);overflow:hidden}
  .bars .track i{display:block;height:100%;background:#9aa0a6;border-radius:8px}
  .bars .mine .track i{background:var(--plate)}
  .month{display:flex;justify-content:space-between;align-items:center;background:var(--road);color:#fff;border-radius:16px;
         padding:12px 16px;margin-top:12px}
  .month b{font-size:26px;color:var(--signal)}

  /* Troubleshooting */
  .steps{display:flex;gap:6px;margin:8px 0 10px}
  .steps i{flex:1;height:8px;border-radius:4px;background:var(--line)}
  .steps i.done{background:var(--plate)}.steps i.now{background:var(--signal)}
  .steptext{font-size:22px;font-weight:600;line-height:1.4;margin:6px 0 14px}

  /* Quick actions (first screen) */
  .greet{font-size:26px;font-weight:800;line-height:1.2;margin:4px 0 0}
  .tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .tile{min-height:96px;border-radius:20px;background:var(--card);border:2px solid var(--line);display:flex;flex-direction:column;
        align-items:flex-start;justify-content:space-between;padding:12px 14px;text-align:left;font-size:19px;font-weight:800;line-height:1.2}
  .tile .ic{width:30px;height:30px;color:var(--plate)}
  :root[data-theme="sun"] .tile .ic{color:var(--signal)}
  .tile.wide{grid-column:1/-1;min-height:72px;flex-direction:row;align-items:center;gap:12px;justify-content:flex-start}

  /* Spoken reply */
  .reply{display:flex;gap:10px;align-items:flex-start;background:var(--road);color:#fff;border-radius:18px;padding:12px 12px 12px 16px}
  :root[data-theme="sun"] .reply{background:#111;border:2px solid var(--signal)}
  .reply p{margin:0;flex:1;font-size:19px;line-height:1.45}
  .reply button{width:48px;height:48px;border-radius:14px;background:var(--signal);color:#16181b;display:flex;align-items:center;justify-content:center}
  .heard{align-self:flex-end;background:var(--signal);color:#16181b;border-radius:16px;border-bottom-right-radius:4px;padding:6px 14px;
         font-size:17px;max-width:90%}
  .note{font-size:14px;color:var(--muted);text-align:center}
  .err{background:var(--warn-soft);color:var(--warn);border:1.5px solid var(--warn);border-radius:14px;padding:10px 14px;font-size:16px}
  :root[data-theme="sun"] .err{color:#ff8a80}

  details.history{font-size:15px;color:var(--muted)}
  details.history summary{min-height:44px;display:flex;align-items:center;font-weight:600;cursor:pointer}
  .hist{display:grid;gap:6px;margin-top:6px}
  .hist div{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 10px;color:var(--ink)}
  .hist .u{font-weight:800}

  /* Bottom dock with the mic */
  .dock{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:var(--dock);
        border-top:1.5px solid var(--line);padding:10px 16px calc(14px + env(safe-area-inset-bottom));z-index:6}
  .dockrow{display:flex;align-items:center;justify-content:space-between}
  .side{width:60px;height:60px;border-radius:18px;background:var(--paper);border:2px solid var(--line);display:flex;
        align-items:center;justify-content:center}
  .mic{width:96px;height:96px;margin-top:-34px;border-radius:50%;background:var(--plate);color:#fff;display:flex;flex-direction:column;
       align-items:center;justify-content:center;font-size:17px;font-weight:800;box-shadow:0 0 0 8px var(--dock),0 0 0 14px rgba(30,122,76,.18)}
  .mic .ic{width:40px;height:40px}
  .mic.rec{background:var(--warn);box-shadow:0 0 0 8px var(--dock),0 0 0 14px rgba(179,38,30,.22)}
  .mic.busy{background:var(--muted)}
  .typed{display:flex;gap:8px;margin-top:10px}
  .typed[hidden]{display:none}
  .typed input{flex:1;min-width:0;height:52px;border-radius:14px;border:2px solid var(--line);background:var(--card);color:var(--ink);
               font:inherit;font-size:18px;padding:0 14px}
  .typed button{height:52px;padding:0 18px;border-radius:14px;background:var(--road);color:#fff;font-weight:800}
  :root[data-theme="sun"] .typed button{background:var(--signal);color:#000}

  /* Listening sheet */
  .listen{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;justify-content:center;z-index:9}
  .listen[hidden]{display:none}
  .sheet{width:100%;max-width:480px;background:var(--card);border-radius:26px 26px 0 0;padding:14px 18px calc(22px + env(safe-area-inset-bottom));
         display:flex;flex-direction:column;gap:12px;align-items:center}
  .grab{width:44px;height:5px;border-radius:3px;background:var(--line)}
  .listen canvas{width:100%;height:110px}
  .listen .timer{font-size:16px;color:var(--muted)}
  .stopbtn{width:100%;height:68px;border-radius:20px;background:var(--warn);color:#fff;font-size:22px;font-weight:800;display:flex;
           align-items:center;justify-content:center;gap:10px}

  /* Safety alarm */
  .alarm{position:fixed;inset:0;background:var(--warn);color:#fff;z-index:10;display:flex;justify-content:center;overflow:auto}
  .alarm[hidden]{display:none}
  .alarm .in{width:100%;max-width:480px;padding:28px 20px calc(24px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:12px}
  .alarm .sign{width:120px;height:120px;border-radius:50%;background:rgba(255,255,255,.15);display:flex;align-items:center;justify-content:center;align-self:center}
  .alarm .sign .ic{width:70px;height:70px}
  .alarm h2{margin:0;font-size:54px;line-height:1;text-align:center}
  .alarm .do{display:flex;align-items:center;gap:12px;background:#fff;color:#16181b;border-radius:18px;padding:14px 16px;font-size:20px;font-weight:800;line-height:1.25}
  .alarm .do .ic{color:var(--warn);width:32px;height:32px}
  .alarm a.call{display:flex;align-items:center;justify-content:center;gap:10px;height:72px;border-radius:20px;background:#f2c200;color:#16181b;
                font-size:23px;font-weight:800;text-decoration:none;margin-top:6px}
  .alarm .close{height:56px;border-radius:16px;border:2px solid rgba(255,255,255,.7);color:#fff;font-size:18px;font-weight:600}

  @media (max-width:360px){
    .bar h1{font-size:21px}
    .barbtn .lbl{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
    .tile{font-size:17px}
  }
  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
  @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="app">
  <header class="bar">
    <h1>ई-रिक्शा सहायक</h1>
    <button class="barbtn" id="sun" aria-pressed="false" aria-label="धूप मोड"><span class="ic" data-i="sun"></span><span class="lbl">धूप</span></button>
    <button class="barbtn" id="reset" aria-label="नई बात शुरू करें"><span class="ic" data-i="refresh"></span><span class="lbl">नई बात</span></button>
  </header>

  <div class="plates" id="plates" hidden aria-label="जो याद है"></div>

  <main id="main">
    <div id="stage"></div>
    <div id="reply" aria-live="polite"></div>
    <details class="history" id="history">
      <summary>पिछली बातें</summary>
      <div class="hist" id="hist"></div>
      <p class="note">रिकॉर्ड की हुई आवाज़ से जांचना हो तो फ़ाइल चुनिए:
        <input type="file" id="file" accept="audio/*" aria-label="ऑडियो फ़ाइल चुनें"></p>
    </details>
  </main>

  <nav class="dock" aria-label="बोलने के बटन">
    <div class="dockrow">
      <button class="side" id="kbd" aria-label="लिखकर पूछें" aria-expanded="false"><span class="ic" data-i="kbd"></span></button>
      <button class="mic" id="mic" aria-label="बोलना शुरू करें"><span class="ic" data-i="mic"></span><span id="micText">बोलिए</span></button>
      <button class="side" id="replay" aria-label="जवाब फिर से सुनें" disabled><span class="ic" data-i="speaker"></span></button>
    </div>
    <form class="typed" id="typed" hidden>
      <input id="typedInput" type="text" placeholder="यहां लिखिए" aria-label="सवाल लिखिए" autocomplete="off">
      <button type="submit">भेजें</button>
    </form>
  </nav>
</div>

<div class="listen" id="listen" hidden role="dialog" aria-label="सुन रहा हूं">
  <div class="sheet">
    <div class="grab"></div>
    <div style="font-size:20px;font-weight:800">सुन रहा हूं…</div>
    <canvas id="wave" width="800" height="220" aria-hidden="true"></canvas>
    <div class="timer" id="timer">0 सेकंड</div>
    <button class="stopbtn" id="stop"><span class="ic" data-i="check"></span>बोल दिया</button>
  </div>
</div>

<div class="alarm" id="alarm" hidden role="alertdialog" aria-labelledby="alarmH">
  <div class="in">
    <div class="sign"><span class="ic" data-i="warn"></span></div>
    <h2 id="alarmH">खतरा!</h2>
    <div class="do"><span class="ic" data-i="power"></span>तुरंत मेन स्विच से चार्जर बंद कीजिए</div>
    <div class="do"><span class="ic" data-i="hand"></span>चार्जर और तार को हाथ मत लगाइए</div>
    <div class="do"><span class="ic" data-i="drop"></span>पानी से दूर रहिए</div>
    <a class="call" href="tel:"><span class="ic" data-i="phone"></span>मैकेनिक को कॉल करें</a>
    <button class="close" id="alarmClose">मैं सुरक्षित हूं, बंद करें</button>
  </div>
</div>

<script>
const ICONS = {
  mic:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v4"/></svg>',
  pin:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s7-7.5 7-13a7 7 0 0 0-14 0c0 5.5 7 13 7 13z"/><circle cx="12" cy="9" r="2.5"/></svg>',
  bat:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="7" width="17" height="10" rx="2"/><path d="M22 11v2"/><rect x="4.5" y="9.5" width="9" height="5" fill="currentColor" stroke="none"/></svg>',
  users:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-3.6 3.4-5.5 6.5-5.5s5.7 1.9 6.5 5.5"/><circle cx="17" cy="9" r="2.5"/><path d="M17.5 14.5c2 .3 3.4 1.8 4 4.5"/></svg>',
  check:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12.5l5 5L20 6.5"/></svg>',
  x:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>',
  warn:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 3L2 20h20L12 3z"/><path d="M12 10v4" stroke-linecap="round"/><circle cx="12" cy="17" r="1" fill="currentColor"/></svg>',
  speaker:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/></svg>',
  wrench:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a4 4 0 0 0 5 5L21 13l-8 8-3.5-3.5 8-8-1.3-1.2zM3 21l6-6"/></svg>',
  bolt:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M13 2L4 14h6l-1 8 9-12h-6l1-8z"/></svg>',
  power:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M12 3v9M6.3 6.5a8 8 0 1 0 11.4 0"/></svg>',
  hand:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M8 13V5a1.5 1.5 0 0 1 3 0v6M11 11V3.5a1.5 1.5 0 0 1 3 0V11M14 11V5a1.5 1.5 0 0 1 3 0v8c0 4-2.5 8-7 8-3 0-5-2-6.5-5L2 12.5a1.5 1.5 0 0 1 2.5-1.5L8 15"/><path d="M3 3l18 18"/></svg>',
  drop:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3s6 7 6 11a6 6 0 0 1-12 0c0-4 6-11 6-11z"/><path d="M3 3l18 18" stroke-linecap="round"/></svg>',
  phone:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M5 3h4l2 5-2.5 1.5a11 11 0 0 0 6 6L16 13l5 2v4a2 2 0 0 1-2 2A17 17 0 0 1 3 5a2 2 0 0 1 2-2z"/></svg>',

    $("alarm").hidden = false; $("alarmClose").focus();

}

async function send(text){
  if (!text || !text.trim() || busy) return;
  setBusy(true);
  try {
    const r = await fetch("/api/text", {method: "POST", headers: {"Content-Type": "application/json"},
      body: JSON.stringify({text, session_id: SESSION_ID})});
    handle(await r.json(), text);
  } catch(e){ handle({error: "इंटरनेट या सर्वर से नहीं जुड़ पाए।"}); }
  finally { setBusy(false); }
}

async function sendAudio(wav){
  setBusy(true, "सुन लिया");
  const fd = new FormData(); fd.append("audio", wav, "audio.wav"); fd.append("session_id", SESSION_ID);
  try {
    const r = await fetch("/api/voice", {method: "POST", body: fd});
    let data = await r.json();
    if (data.error) data = {error: "आवाज़ समझ नहीं पाए। फिर से बोलिए, या नीचे लिखकर पूछिए।", detail: data.error};
    handle(data, "(आवाज़)");
  }
  catch(e){ handle({error: "आवाज़ सर्वर तक नहीं पहुंची।"}); }
  finally { setBusy(false); }
}

/* ---------- Recording: any audio -> 16 kHz mono WAV ---------- */
async function toWav(arrayBuffer){
  const ctx = new (window.AudioContext || window.webkitAudioContext)();
  const decoded = await ctx.decodeAudioData(arrayBuffer);
  const rate = 16000;
  const off = new OfflineAudioContext(1, Math.ceil(decoded.duration * rate), rate);
  const src = off.createBufferSource(); src.buffer = decoded; src.connect(off.destination); src.start();
  const pcm = (await off.startRendering()).getChannelData(0);
  const buf = new ArrayBuffer(44 + pcm.length * 2), v = new DataView(buf);
  const w = (o, s) => { for (let i = 0; i < s.length; i++) v.setUint8(o + i, s.charCodeAt(i)); };
  w(0,"RIFF"); v.setUint32(4, 36 + pcm.length*2, true); w(8,"WAVE"); w(12,"fmt ");
  v.setUint32(16,16,true); v.setUint16(20,1,true); v.setUint16(22,1,true);
  v.setUint32(24,rate,true); v.setUint32(28,rate*2,true); v.setUint16(32,2,true); v.setUint16(34,16,true);
  w(36,"data"); v.setUint32(40, pcm.length*2, true);
  for (let i = 0; i < pcm.length; i++){ const s = Math.max(-1, Math.min(1, pcm[i])); v.setInt16(44 + i*2, s < 0 ? s*0x8000 : s*0x7FFF, true); }
  return new Blob([buf], {type: "audio/wav"});
}

let recorder = null, stream = null, chunks = [], raf = 0, tick = 0, audioCtx = null;
const MAX_SECONDS = 15;

function drawWave(analyser){
  const c = $("wave"), g = c.getContext("2d"), data = new Uint8Array(analyser.frequencyBinCount);
  const color = getComputedStyle(document.documentElement).getPropertyValue("--plate").trim() || "#1e7a4c";
  const loop = () => {
    analyser.getByteFrequencyData(data);
    g.clearRect(0, 0, c.width, c.height);
    const n = 28, bw = c.width / n;
    for (let i = 0; i < n; i++){
      const val = data[Math.floor(i * data.length / n / 2)] / 255;
      const h = Math.max(12, val * c.height * .95);
      g.fillStyle = color; g.beginPath();
      g.roundRect ? g.roundRect(i * bw + bw * .25, (c.height - h) / 2, bw * .5, h, 8) : g.rect(i * bw + bw * .25, (c.height - h) / 2, bw * .5, h);
      g.fill();
    }
    raf = requestAnimationFrame(loop);
  };
  loop();
}

async function startRec(){
  if (busy) return;
  try { stream = await navigator.mediaDevices.getUserMedia({audio: true}); }
  catch(e){ handle({error: "माइक की इजाज़त नहीं मिली। ब्राउज़र सेटिंग में माइक चालू कीजिए।"}); return; }
  chunks = []; recorder = new MediaRecorder(stream);
  recorder.ondataavailable = (e) => chunks.push(e.data);
  recorder.onstop = async () => {
    cancelAnimationFrame(raf); clearInterval(tick); stream.getTracks().forEach(t => t.stop());
    if (audioCtx) { audioCtx.close().catch(()=>{}); audioCtx = null; }
    $("listen").hidden = true; $("mic").classList.remove("rec"); $("mic").focus();
    try { sendAudio(await toWav(await new Blob(chunks, {type: recorder.mimeType}).arrayBuffer())); }
    catch(e){ handle({error: "रिकॉर्डिंग पढ़ी नहीं जा सकी।"}); }
  };
  recorder.start();
  $("mic").classList.add("rec"); $("listen").hidden = false; $("stop").focus();
  try {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const an = audioCtx.createAnalyser(); an.fftSize = 256;
    audioCtx.createMediaStreamSource(stream).connect(an); drawWave(an);
  } catch(e) {}
  let secs = 0; $("timer").textContent = "0 सेकंड";
  tick = setInterval(() => { secs++; $("timer").textContent = secs + " सेकंड";
    if (secs >= MAX_SECONDS && recorder.state === "recording") recorder.stop(); }, 1000);
}
const stopRec = () => { if (recorder && recorder.state === "recording") recorder.stop(); };
$("mic").onclick = () => (recorder && recorder.state === "recording") ? stopRec() : startRec();
$("stop").onclick = stopRec;

$("file").addEventListener("change", async (e) => {
  const f = e.target.files[0]; if (!f) return;
  try { sendAudio(await toWav(await f.arrayBuffer())); } catch(err){ handle({error: "ये फ़ाइल नहीं खुली।"}); }
  e.target.value = "";
});

render({kind: "home"});
</script>
